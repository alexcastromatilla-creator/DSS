<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Banquete</title>
<style>
  :root {
    --bg: #171220; --panel: #2a2233; --accent: #d4a24c; --text: #f2ece0;
    --p0: #e15757; --p1: #4cb8a0; --p2: #e1a940; --p3: #5aa9e6; --p4: #b06ee0; --p5: #6ee0a8;
  }
  * { box-sizing: border-box; }
  @keyframes bgDrift {
    0% { background-position: 0% 0%, 0 0; }
    100% { background-position: 100% 100%, 40px 40px; }
  }
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-1.5deg); }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,162,76,0.0), 0 2px 6px rgba(0,0,0,0.3); }
    50% { box-shadow: 0 0 18px 2px rgba(212,162,76,0.35), 0 2px 6px rgba(0,0,0,0.3); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes diceRoll {
    0% { transform: rotate(0deg) scale(1); }
    30% { transform: rotate(140deg) scale(1.15); }
    60% { transform: rotate(250deg) scale(0.95); }
    100% { transform: rotate(360deg) scale(1); }
  }
  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.6) translateY(6px); }
    40% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.3) translateY(-14px); }
  }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text); min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(212,162,76,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(90,169,230,0.10), transparent 40%),
      linear-gradient(135deg, #1b1622 0%, #171220 50%, #201830 100%);
    background-size: 200% 200%, 60px 60px, 100% 100%;
    animation: bgDrift 30s ease-in-out infinite alternate;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
  h1 { font-size: 1.5rem; text-align: center; color: var(--accent); margin: 12px 0 4px; letter-spacing: 1px; }
  h2 { font-size: 1.1rem; color: var(--accent); margin: 18px 0 8px; }
  .sub { text-align: center; color: #b8afc4; font-size: 0.85rem; margin-bottom: 16px; }
  .card {
    background: linear-gradient(160deg, var(--panel), #241d30);
    border: 1px solid rgba(212,162,76,0.12);
    border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    animation: fadeSlideIn 0.35s ease-out;
  }
  input[type=text], input[type=number] {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4a3f5c; background: #17131d; color: var(--text);
    font-size: 1rem; margin-bottom: 10px;
  }
  select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #4a3f5c; background: #17131d; color: var(--text); margin-bottom: 10px; font-size: 0.95rem;}
  button {
    width: 100%; padding: 13px; border-radius: 8px; border: none; background: var(--accent); color: #1b1622;
    font-weight: 700; font-size: 1rem; margin-bottom: 8px; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; }
  button.secondary { background: #423861; color: var(--text); }
  .option-btn { background: #3a3050; color: var(--text); text-align: left; font-weight: 500; }
  .option-btn.chosen { background: var(--accent); color: #1b1622; animation: glowPulse 1.6s ease-in-out infinite; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; margin-right: 4px; }
  .players-list { display: flex; flex-direction: column; gap: 8px; }
  .player-chip { display: flex; justify-content: space-between; align-items: center; background: #241d2e; padding: 8px 12px; border-radius: 8px; animation: fadeSlideIn 0.3s ease-out; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .territories { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .territory { background: #241d2e; border-radius: 8px; padding: 8px; font-size: 0.8rem; border: 2px solid transparent; transition: border-color 0.3s ease; }
  .era-label { color: var(--accent); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px; margin: 8px 0 4px; text-transform: uppercase; opacity: 0.85; }
  .unit-icons { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 1px; vertical-align: middle; margin-top: 3px; }
  .unit-icon { font-size: 1rem; line-height: 1; display: inline-block; animation: idleFloat 3.2s ease-in-out infinite; }
  .unit-icons b { margin-left: 5px; color: var(--accent); font-size: 0.78rem; font-weight: 700; }
  .map-legend { font-size: 0.7rem; line-height: 1.5; margin-bottom: 10px; }
  .terr-shape { cursor: pointer; }
  .terr-shape:active { opacity: 0.75; }
  @keyframes flashPulse {
    0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,0.3); transform: scale(1); }
    50% { box-shadow: 0 0 0 3px var(--accent), 0 2px 10px rgba(0,0,0,0.4); transform: scale(1.03); }
  }
  .territory.flash { animation: flashPulse 0.9s ease-in-out; }
  .log { font-size: 0.85rem; color: #cbc2d9; max-height: 200px; overflow-y: auto; }
  .log div { padding: 4px 0; border-bottom: 1px solid #382e48; animation: fadeSlideIn 0.25s ease-out; }
  .center { text-align: center; }
  .muted { color: #9d92ae; font-size: 0.85rem; }
  .flavor { font-style: italic; color: #cbc2d9; line-height: 1.4; }
  .rank { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #241d2e; border-radius: 8px; margin-bottom: 6px; }
  .rank.first { border: 2px solid var(--accent); animation: glowPulse 1.8s ease-in-out infinite; }
  #err { color: #ff8080; text-align: center; min-height: 20px; font-size: 0.85rem; }

  /* Retratos: círculo con icono; si hay ilustración real en public/images/ se ve encima. */
  .portrait {
    width: 46px; height: 46px; min-width: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    border: 2px solid rgba(255,255,255,0.15);
    animation: idleFloat 4.5s ease-in-out infinite;
  }
  .portrait.big { width: 68px; height: 68px; font-size: 2.1rem; }
  .portrait-row { display: flex; align-items: center; gap: 12px; }

  .char-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; animation: fadeSlideIn 0.4s ease-out; }
  .char-item .portrait { width: 34px; height: 34px; min-width: 34px; font-size: 1.1rem; }

  /* Marco "cuadro pintado": si hay ilustración real en public/images/ se muestra encima;
     si no, se ve el icono con el mismo marco ornamentado. */
  .frame { position: relative; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    box-shadow: 0 0 0 2px #17131d, 0 0 0 4px var(--accent), 0 3px 8px rgba(0,0,0,0.4);
    animation: idleFloat 4.5s ease-in-out infinite; background: #3a3050;
    display: flex; align-items: center; justify-content: center; }
  .frame::after { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 48%, transparent 66%);
    background-size: 220% 220%; animation: sheen 4s ease-in-out infinite; pointer-events: none; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .frame.medium { width: 46px; height: 46px; font-size: 1.5rem; }
  .frame.small { width: 34px; height: 34px; font-size: 1.1rem; }
  .frame.big { width: 78px; height: 78px; font-size: 2.2rem; }
  @keyframes sheen {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  /* Tarjetas de líder (pantalla de selección estilo "elige tu civilización") */
  .leader-card { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; }
  .leader-card .info { flex: 1; }
  .leader-card .name { font-weight: 700; margin-bottom: 1px; }
  .leader-card .ltitle { font-size: 0.75rem; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.8; margin-bottom: 3px; }
  .leader-card .desc { font-weight: 400; font-size: 0.78rem; opacity: 0.85; line-height: 1.3; }
  .leader-card.chosen .desc, .leader-card.chosen .ltitle { opacity: 0.95; }

  /* Animación de dados durante la resolución de combate */
  .dice-row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  .die { width: 26px; height: 26px; border-radius: 6px; background: #3a3050; border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    animation: diceRoll 0.5s ease-out; }

  .sparkle-emoji { display: inline-block; animation: sparkle 1.1s ease-out; }

  /* Monumento de fondo: cambia según la Era. */
  #monumentBg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: 0.16; }
  #monumentBg svg, #monumentBg img { position: absolute; bottom: -4%; left: 50%; transform: translateX(-50%);
    width: 130%; max-width: 900px; animation: monumentPan 40s ease-in-out infinite alternate; }
  #monumentBg img { object-fit: cover; height: 60%; width: 100%; max-width: none; }
  @keyframes monumentPan {
    0% { transform: translateX(-52%) scale(1); }
    100% { transform: translateX(-48%) scale(1.04); }
  }
  #app { position: relative; z-index: 1; }

  /* Barra persistente de sala: código, Recursos, reiniciar (anfitrión) y salir */
  #roomBar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 2px 10px; font-size: 0.8rem; }
  #roomBar .roomBarBtns { display: flex; gap: 6px; }
  button.tiny { width: auto; padding: 6px 10px; font-size: 0.78rem; margin-bottom: 0; border-radius: 20px; }

  /* Panel de tropas: una sección por clase, con su ventaja y su escalera de niveles */
  .troop-tier { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #382e48; }
  .troop-tier:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .troop-tier-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .troop-tier-head .portrait { width: 40px; height: 40px; min-width: 40px; font-size: 1.3rem; }
  .tactica { font-size: 0.76rem; color: #cbc2d9; margin: 2px 0 8px; line-height: 1.35; }
  .level-ladder { margin-bottom: 8px; }
  .level-row { padding: 4px 0 6px 10px; border-left: 3px solid #3a3050; margin-bottom: 2px; }
  .level-row.level-current { border-left-color: var(--accent); }
  .level-row-title { font-weight: 600; font-size: 0.82rem; }
  .level-row-desc { font-size: 0.74rem; margin-top: 2px; line-height: 1.35; }
  .level-up-btn { font-size: 0.85rem; }

  /* Tabla de vías de victoria */
  .victory-row { display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: #241d2e; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; font-size: 0.82rem; }
  .victory-row .vname { flex: 1; font-weight: 600; }
  .victory-row .vstat { min-width: 62px; text-align: right; }
  .victory-note { font-size: 0.72rem; line-height: 1.4; }
</style>
</head>
<body>
<div id="monumentBg" aria-hidden="true"></div>
<div id="app">
  <h1>🍷 EL BANQUETE</h1>
  <div class="sub">Estrategia, historia y brindis — para 2 a 6 jugadores</div>
  <div id="roomBar"></div>
  <div id="err"></div>
  <div id="screen"></div>
</div>

<script>
let myId = localStorage.getItem('banquete_playerId') || null;
let state = null;
let joinedName = '';
const screen = document.getElementById('screen');
const errBox = document.getElementById('err');

const PLAYER_COLORS = ['var(--p0)', 'var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)', 'var(--p5)'];
const PLAYER_COLORS_RAW = ['#e15757', '#4cb8a0', '#e1a940', '#5aa9e6', '#b06ee0', '#6ee0a8'];
// Mismo tamaño de lienzo que usa el servidor para calcular coordenadas y polígonos.
const MAP_W = 320, MAP_H = 380;
const CLASS_KEYS = ['inf', 'cab', 'arq'];
const ERA_LABELS = { 1: 'Era I', 2: 'Era II', 3: 'Era III' };

function colorFor(playerId) {
  if (!state) return '#666';
  const idx = state.players.findIndex(p => p.id === playerId);
  return idx >= 0 ? PLAYER_COLORS_RAW[idx] : '#666';
}
function nameFor(playerId) {
  if (!state) return '';
  const p = state.players.find(p => p.id === playerId);
  return p ? p.name : '';
}
function me() { return state && state.players.find(p => p.id === myId); }
function clsDef(cls) { return state.troopClasses[cls] || state.troopClasses.inf; }
function clsEraName(cls, era) { const c = clsDef(cls); return (c.byEra[era] || c.byEra[1]).name; }
function clsEraIcon(cls, era) { const c = clsDef(cls); return (c.byEra[era] || c.byEra[1]).icon; }
function counterOf(cls) { return CLASS_KEYS.find(k => state.troopClasses[k].beats === cls); }
// Coste real de subir de nivel una clase para MÍ (Sun Tzu paga 2 menos, igual que en el servidor).
function myLevelCost(baseCost) {
  const m = me();
  return Math.max(1, baseCost - (m && m.leader === 'suntzu' ? 2 : 0));
}

// Fila visual de unidades: repite el icono de la clase de guarnición una vez por tropa (máx 6).
function unitBadge(t) {
  const icon = clsEraIcon(t.unitClass, t.era);
  const n = Math.max(0, t.armies || 0);
  if (!n) return `<span class="unit-icons muted">sin tropas</span>`;
  const shown = Math.min(n, 6);
  const icons = Array.from({ length: shown }, (_, i) => `<span class="unit-icon" style="animation-delay:${(i * 0.15).toFixed(2)}s">${icon}</span>`).join('');
  return `<span class="unit-icons">${icons}<b>×${n}</b></span>`;
}
// Marco de "cuadro pintado": ilustración real si existe en public/images/<portrait>, si no el icono.
function portraitFrame(entity, size) {
  const sizeClass = size || 'medium';
  const img = entity.portrait ? `<img src="/images/${entity.portrait}" alt="" onerror="this.remove()">` : '';
  return `<span class="frame ${sizeClass}">${img}<span class="fallback">${entity.icon || '👑'}</span></span>`;
}

function showError(msg) {
  errBox.textContent = msg;
  setTimeout(() => { errBox.textContent = ''; }, 3500);
}

function handleNotice(notice) {
  if (!notice) return;
  if (notice.type === 'spy_result') {
    alert(`Espionaje sobre ${notice.target}:\n${notice.info}`);
  }
}

// Dibujo vectorial de reserva para el monumento de fondo de cada Era.
const MONUMENT_SVG = {
  1: `<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="var(--accent)">
    <polygon points="200,15 350,95 50,95"/>
    <rect x="45" y="95" width="310" height="10"/>
    ${[0,1,2,3,4,5,6].map(i => `<rect x="${60 + i*40}" y="105" width="16" height="75"/>`).join('')}
    <rect x="40" y="180" width="320" height="16"/>
  </svg>`,
  2: `<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="var(--accent)">
    <rect x="50" y="120" width="300" height="60"/>
    <circle cx="200" cy="108" r="52"/>
    <rect x="172" y="150" width="56" height="35"/>
    <rect x="66" y="55" width="14" height="130"/>
    <polygon points="66,55 80,55 73,35"/>
    <rect x="320" y="55" width="14" height="130"/>
    <polygon points="320,55 334,55 327,35"/>
  </svg>`,
  3: `<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="var(--accent)">
    <rect x="60" y="130" width="140" height="50"/>
    <polygon points="130,60 200,130 60,130"/>
    <ellipse cx="130" cy="60" rx="30" ry="14"/>
    <rect x="210" y="90" width="150" height="90"/>
    <polygon points="210,150 250,120 320,120 360,150"/>
    <polygon points="230,120 250,90 320,90 340,120"/>
  </svg>`,
};

function renderMonumentBg() {
  const bg = document.getElementById('monumentBg');
  if (!bg) return;
  const era = (state && state.era) || 1;
  if (bg.dataset.era === String(era)) return;
  bg.dataset.era = String(era);
  const file = state && state.eraInfo && state.eraInfo.monumento ? state.eraInfo.monumento : `monumento_era${era}.png`;
  bg.innerHTML = `
    ${MONUMENT_SVG[era] || MONUMENT_SVG[1]}
    <img src="/images/${file}" alt="" onerror="this.remove()">
  `;
}
renderMonumentBg();

function renderRoomBar() {
  const bar = document.getElementById('roomBar');
  if (!bar) return;
  if (!state || !state.code) { bar.innerHTML = ''; return; }
  const isHost = state.players[0] && state.players[0].id === myId;
  const m = me();
  const showResources = m && state.phase !== 'lobby';
  bar.innerHTML = `
    <span class="muted">Sala ${state.code}${showResources ? ` · 💰 ${m.resources || 0}` : ''}</span>
    <span class="roomBarBtns">
      ${isHost ? `<button class="tiny secondary" id="restartBtn">🔄 Reiniciar</button>` : ''}
      <button class="tiny secondary" id="exitBtn">🚪 Salir</button>
    </span>
  `;
  const restartBtn = document.getElementById('restartBtn');
  if (restartBtn) restartBtn.onclick = () => call('restart_room');
  document.getElementById('exitBtn').onclick = () => {
    localStorage.removeItem('banquete_playerId');
    location.reload();
  };
}

function call(action, payload) {
  return fetch('/api/' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...(payload || {}), playerId: myId }),
  }).then((r) => r.json()).then((r) => { if (r && r.error) showError(r.error); return r; });
}

let es = null;
function connectStream() {
  if (es) es.close();
  es = new EventSource('/events?playerId=' + encodeURIComponent(myId));
  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleNotice(data.notice);
    state = data;
    render();
  };
}

async function boot() {
  if (!myId) {
    const r = await fetch('/api/new_id').then((x) => x.json());
    myId = r.playerId;
    localStorage.setItem('banquete_playerId', myId);
  }
  connectStream();
  render();
}
boot();

function render() {
  renderRoomBar();
  renderMonumentBg();
  if (!state) return renderConnect();
  switch (state.phase) {
    case 'lobby': return renderLobby();
    case 'era_intro': return renderEraIntro();
    case 'orders': return renderOrders();
    case 'resolve': return renderResolve();
    case 'desafio': return renderDesafio();
    case 'simposio': return renderSimposio();
    case 'fin': return renderFin();
    default: return renderConnect();
  }
}

function renderConnect() {
  screen.innerHTML = `
    <div class="card">
      <h2>Entrar en una partida</h2>
      <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="20">
    </div>
    <div class="card">
      <h2>Crear sala nueva</h2>
      <p class="muted">¿Cuántos jugadores en total (contándote a ti)?</p>
      <select id="maxPlayersInput">
        <option value="2">2 jugadores</option>
        <option value="3" selected>3 jugadores</option>
        <option value="4">4 jugadores</option>
        <option value="5">5 jugadores</option>
        <option value="6">6 jugadores</option>
      </select>
      <p class="muted">¿Cuántos de ellos son bots (para testear solo/a)?</p>
      <select id="botsInput"></select>
      <button id="createBtn">Crear sala nueva</button>
    </div>
    <div class="card">
      <h2>Unirte a una sala</h2>
      <input type="text" id="codeInput" placeholder="Código de sala (ej. LYNX)" maxlength="4" style="text-transform:uppercase">
      <button class="secondary" id="joinBtn">Unirme</button>
    </div>
  `;
  const maxPlayersInput = document.getElementById('maxPlayersInput');
  const botsInput = document.getElementById('botsInput');
  function refreshBotsOptions() {
    const total = parseInt(maxPlayersInput.value, 10);
    botsInput.innerHTML = '';
    for (let i = 0; i <= total - 1; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i === 0 ? `Ningún bot (${total} humanos)` : `${i} bot${i > 1 ? 's' : ''} (${total - i} humano${total - i > 1 ? 's' : ''})`;
      botsInput.appendChild(opt);
    }
    botsInput.value = 0;
  }
  maxPlayersInput.onchange = refreshBotsOptions;
  refreshBotsOptions();

  document.getElementById('createBtn').onclick = () => {
    joinedName = document.getElementById('nameInput').value || 'Jugador';
    call('create_room', {
      name: joinedName,
      maxPlayers: parseInt(maxPlayersInput.value, 10),
      botsWanted: parseInt(botsInput.value, 10),
    });
  };
  document.getElementById('joinBtn').onclick = () => {
    joinedName = document.getElementById('nameInput').value || 'Jugador';
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) { showError('Escribe el código de la sala.'); return; }
    call('join_room', { code, name: joinedName });
  };
}

function renderLobby() {
  const isHost = state.players[0] && state.players[0].id === myId;
  const m = me();
  const leaderKeys = Object.keys(state.leaders);
  screen.innerHTML = `
    <div class="card center">
      <div class="muted">Código de sala</div>
      <h1 style="margin:4px 0;">${state.code}</h1>
      <div class="muted">Compártelo con tus jugadores humanos (los bots ya están dentro)</div>
    </div>
    <div class="card">
      <h2>Jugadores (${state.players.length}/${state.maxPlayers})</h2>

        ⚔️ <b style="color:var(--text)">Tropas:</b> 3 clases — Infantería vence a Caballería, Caballería vence a las tropas A distancia, y éstas vencen a Infantería (+1 dado). Cada territorio tiene una clase de guarnición visible en el mapa.<br><br>
        🎯 <b style="color:var(--text)">Atacar:</b> Asalto (conquistar), Asedio (desgastar sin arriesgar tanto) o Incursión (robar Recursos).<br><br>
        🏆 <b style="color:var(--text)">Ganar:</b> por Dominación (controlar la mayoría del mapa), por Cultura (construir 3 Maravillas 🏛️ con Recursos 💰) o por Gloria al final de la Era III.

    <div class="card">

function renderOrders() {
  const m = me();
  const submitted = state.ordersSubmitted.includes(myId);
  const myTerritories = Object.values(state.territories).filter(t => t.open && t.owner === myId);
  const otherPlayers = state.players.filter(p => p.id !== myId);

  // Objetivos alcanzables: territorios libres en la 1ª ronda de la Era (se colonizan desde
  // la reserva), o vecinos de un territorio tuyo con tropas de sobra.
  const isBootstrapRound = state.round === 1;
  const bootstrapTargets = isBootstrapRound
    ? Object.values(state.territories).filter(t => t.open && t.era === state.era && !t.owner)
    : [];
  const reachableIds = new Set();
  myTerritories.forEach(t => {
    if (t.armies > 1) {
      t.neighbors.forEach(nId => {
        const n = state.territories[nId];
        if (n && n.open && n.owner !== myId) reachableIds.add(nId);
      });
    }
  });
  const attackMap = new Map();
  bootstrapTargets.forEach(t => attackMap.set(t.id, t));
  reachableIds.forEach(id => attackMap.set(id, state.territories[id]));
  const attackable = [...attackMap.values()];

  // Antes de reconstruir la pantalla, guardamos lo que estuvieras rellenando (si otro jugador
  // envía su orden, esto se vuelve a renderizar entero y sin esto perderías tu selección).
  const prevOrderType = document.getElementById('orderType')?.value;
  const prevTargetTerr = document.getElementById('targetTerr')?.value;
  const prevAttackMode = document.getElementById('attackMode')?.value;
  const prevFromTerr = document.getElementById('fromTerr')?.value;
  const prevAmount = document.getElementById('amount')?.value;
  const prevUnitClass = document.getElementById('unitClassSel')?.value;
  const prevTargetPlayer = document.getElementById('targetPlayer')?.value;

  screen.innerHTML = `
    ${renderBoard()}
    <div class="card">
      <h2>Tus órdenes — Ronda ${state.round}</h2>
      <p class="muted">Reserva disponible: ${m.reserve} tropa(s) · Recursos: ${m.resources || 0} 💰</p>
      ${submitted ? `<p class="center">Orden enviada. Esperando a los demás (${state.ordersSubmitted.length}/${state.players.length})…</p>` : `
      <select id="orderType">
        <option value="atacar">⚔️ Atacar / Colonizar</option>
        <option value="reforzar">🛡️ Reforzar</option>
        <option value="reclutar">👑 Reclutar Personaje</option>
        <option value="espiar">🕵️ Espiar</option>
      </select>
      <div id="orderFields"></div>
      <button id="sendOrder">Enviar orden</button>
      `}
    </div>
    ${state.you.characters.length ? `<div class="card"><h2>Tus Personajes</h2>${state.you.characters.map(c => `
      <div class="char-item">
        ${portraitFrame(c, 'small')}
        <span class="muted"><b style="color:var(--text)">${c.name}</b> — ${c.flavor}</span>
      </div>`).join('')}</div>` : ''}
    ${renderVictoryPanel()}
    ${renderTroopPanel()}
    ${renderWonderPanel()}
  `;
  wirePanels();
  if (submitted) return;

  function describeTarget(t) {
    const ownerTxt = t.owner ? nameFor(t.owner) : 'neutral';
    return `${t.icon || ''} ${t.name} (${ownerTxt}, ${t.armies} ${clsEraIcon(t.unitClass, t.era)} ${clsEraName(t.unitClass, t.era)})`;
  }

  function renderAttackDetails() {
    const targetEl = document.getElementById('targetTerr');
    const wrap = document.getElementById('attackDetails');
    if (!targetEl || !wrap) return;
    const target = state.territories[targetEl.value];
    const isBootstrap = isBootstrapRound && target.era === state.era && !target.owner;
    const sources = myTerritories.filter(t => t.armies > 1 && t.neighbors.includes(target.id));

    if (isBootstrap) {
      // Colonización: eliges la CLASE con la que desembarcas desde tu reserva. Se sugiere la
      // clase con ventaja sobre la guarnición local.
      const suggested = counterOf(target.unitClass);
      wrap.innerHTML = `
        <p class="muted">Territorio libre — desembarcas desde tu reserva y eliges la clase de tropa. La guarnición local es ${clsEraName(target.unitClass, target.era)} ${clsEraIcon(target.unitClass, target.era)}; la clase con ventaja contra ella es ${clsEraName(suggested, state.era)} ${clsEraIcon(suggested, state.era)}.</p>
        <select id="unitClassSel">
          ${CLASS_KEYS.map(k => `<option value="${k}" ${k === suggested ? 'selected' : ''}>${clsEraIcon(k, state.era)} ${clsEraName(k, state.era)} (${clsDef(k).clase})${state.troopClasses[k].beats === target.unitClass ? ' — ¡ventaja!' : ''}</option>`).join('')}
        </select>
        <input type="text" id="amount" placeholder="Tropas desde tu reserva (máx ${m.reserve})">
      `;
      return;
    }

    if (!sources.length) {
      wrap.innerHTML = `<p class="muted">No tienes ningún territorio con tropas de sobra junto a ${target.name}.</p>`;
      return;
    }

    const modeEl = document.getElementById('attackMode');
    const mode = modeEl ? modeEl.value : 'asalto';
    const canRaid = !!target.owner;
    wrap.innerHTML = `
      <select id="attackMode">
        <option value="asalto">⚔️ Asalto — combate total: si aniquilas la guarnición, conquistas el territorio</option>
        <option value="asedio">💣 Asedio — duelo a 1 dado: si ganas, el defensor pierde 1 tropa (sin conquistar; arriesgas 1)</option>
        ${canRaid ? `<option value="incursion">🐎 Incursión — duelo a 1 dado: si ganas, robas hasta 3 Recursos 💰 (sin conquistar)</option>` : ''}
      </select>
      <select id="fromTerr">${sources.map(t => `<option value="${t.id}">${t.icon || ''} ${t.name} — ${t.armies} ${clsEraIcon(t.unitClass, t.era)} ${clsEraName(t.unitClass, t.era)}${state.troopClasses[t.unitClass].beats === target.unitClass ? ' (¡ventaja de clase!)' : (state.troopClasses[target.unitClass].beats === t.unitClass ? ' (clase en desventaja)' : '')}</option>`).join('')}</select>
      <div id="amountWrap"></div>
    `;
    const modeSel = document.getElementById('attackMode');
    if (mode && [...modeSel.options].some(o => o.value === mode)) modeSel.value = mode;
    function refreshAmount() {
      const wrapA = document.getElementById('amountWrap');
      if (modeSel.value === 'asalto') {
        wrapA.innerHTML = `<input type="text" id="amount" placeholder="Tropas a enviar (déjate al menos 1 en el origen)">`;
      } else {
        wrapA.innerHTML = `<p class="muted">${modeSel.value === 'asedio' ? 'El asedio no mueve tropas: es un duelo de desgaste a distancia.' : 'La incursión no mueve tropas: es un golpe rápido a la bolsa del rival.'}</p>`;
      }
    }
    modeSel.onchange = refreshAmount;
    refreshAmount();
  }

  function renderFields() {
    const type = document.getElementById('orderType').value;
    const fields = document.getElementById('orderFields');
    if (type === 'atacar') {
      if (!attackable.length) {
        fields.innerHTML = `<p class="muted">No tienes ningún objetivo alcanzable este turno (te falta un territorio vecino con tropas de sobra).</p>`;
        return;
      }
      fields.innerHTML = `
        <select id="targetTerr">${attackable.map(t => `<option value="${t.id}">${describeTarget(t)}</option>`).join('')}</select>
        <div id="attackDetails"></div>
      `;
      document.getElementById('targetTerr').onchange = renderAttackDetails;
      renderAttackDetails();
    } else if (type === 'reforzar') {
      fields.innerHTML = myTerritories.length ? `
        <select id="targetTerr">${myTerritories.map(t => `<option value="${t.id}">${t.icon || ''} ${t.name} (${t.armies} ${clsEraIcon(t.unitClass, t.era)})</option>`).join('')}</select>
        <input type="text" id="amount" placeholder="Tropas a añadir (máx ${m.reserve})">
      ` : `<p class="muted">Aún no controlas ningún territorio.</p>`;
    } else if (type === 'espiar') {
      fields.innerHTML = `<select id="targetPlayer">${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
    } else {
      fields.innerHTML = `<p class="muted">Robas 1 personaje al azar del mazo de esta Era.</p>`;
    }
  }
  document.getElementById('orderType').onchange = renderFields;
  if (prevOrderType && [...document.getElementById('orderType').options].some(o => o.value === prevOrderType)) {
    document.getElementById('orderType').value = prevOrderType;
  }
  renderFields();

  // Restauramos las selecciones más finas ahora que existen los campos correspondientes.
  const typeNow = document.getElementById('orderType').value;
  if (typeNow === 'atacar') {
    const targetSel = document.getElementById('targetTerr');
    if (targetSel && prevTargetTerr && [...targetSel.options].some(o => o.value === prevTargetTerr)) {
      targetSel.value = prevTargetTerr;
      renderAttackDetails();
      const modeSel = document.getElementById('attackMode');
      if (modeSel && prevAttackMode && [...modeSel.options].some(o => o.value === prevAttackMode)) {
        modeSel.value = prevAttackMode;
        modeSel.onchange();
      }
      const fromSel = document.getElementById('fromTerr');
      if (fromSel && prevFromTerr && [...fromSel.options].some(o => o.value === prevFromTerr)) fromSel.value = prevFromTerr;
      const clsSel = document.getElementById('unitClassSel');
      if (clsSel && prevUnitClass && [...clsSel.options].some(o => o.value === prevUnitClass)) clsSel.value = prevUnitClass;
    }
  } else if (typeNow === 'reforzar') {
    const targetSel = document.getElementById('targetTerr');
    if (targetSel && prevTargetTerr && [...targetSel.options].some(o => o.value === prevTargetTerr)) targetSel.value = prevTargetTerr;
  } else if (typeNow === 'espiar') {
    const targetSel = document.getElementById('targetPlayer');
    if (targetSel && prevTargetPlayer) targetSel.value = prevTargetPlayer;
  }
  const amountElRestore = document.getElementById('amount');
  if (amountElRestore && prevAmount) amountElRestore.value = prevAmount;

  document.getElementById('sendOrder').onclick = () => {
    const type = document.getElementById('orderType').value;
    let order = { type };
    if (type === 'atacar') {
      const targetEl = document.getElementById('targetTerr');
      if (!targetEl) { showError('No tienes ningún objetivo alcanzable.'); return; }
      order.to = targetEl.value;
      const target = state.territories[order.to];
      const isBootstrap = isBootstrapRound && target.era === state.era && !target.owner;
      if (isBootstrap) {
        order.mode = 'asalto';
        const clsSel = document.getElementById('unitClassSel');
        if (clsSel) order.unitClass = clsSel.value;
        const amountEl = document.getElementById('amount');
        order.amount = amountEl ? (parseInt(amountEl.value) || 0) : 0;
      } else {
        const modeSel = document.getElementById('attackMode');
        const fromEl = document.getElementById('fromTerr');
        if (!fromEl) { showError('Elige un territorio de origen con tropas de sobra.'); return; }
        order.mode = modeSel ? modeSel.value : 'asalto';
        order.from = fromEl.value;
        if (order.mode === 'asalto') {
          const amountEl = document.getElementById('amount');
          order.amount = amountEl ? (parseInt(amountEl.value) || 0) : 0;
        }
      }
    } else if (type === 'reforzar') {
      if (!myTerritories.length) return;
      order.territoryId = document.getElementById('targetTerr').value;
      order.amount = parseInt(document.getElementById('amount').value) || 0;
    } else if (type === 'espiar') {
      order.targetId = document.getElementById('targetPlayer').value;
    }
    call('submit_order', { order });
  };
}

// Paneles compartidos: tablero, vías de victoria, tropas/mejoras y maravillas

function renderBoard() {
  const eras = [1, 2, 3];
  const allTerrs = Object.values(state.territories);
  const openTerrs = allTerrs.filter(t => t.open);
  return `<div class="card"><h2>Tablero</h2>
    ${renderMapSvg(allTerrs)}
    ${eras.map(e => {
      const terrs = openTerrs.filter(t => t.era === e);
      if (!terrs.length) return '';
      return `<div class="era-label">${ERA_LABELS[e]}</div>
      <div class="territories" style="margin-bottom:8px;">
        ${terrs.map(t => `
          <div class="territory" id="terr-${t.id}" style="border-color:${t.owner ? colorFor(t.owner) : '#4a3f5c'}">
            <b>${t.wonder ? t.wonder.icon + ' ' : ''}${t.icon || ''} ${t.name}</b><br>
            <span class="muted">${t.owner ? nameFor(t.owner) : 'Neutral'}${t.owner === myId ? ' · tuyo' : ''} · ${clsEraName(t.unitClass, t.era)}</span><br>
            ${unitBadge(t)}
            ${t.wonder ? `<div class="muted" style="margin-top:2px;">🏛️ ${t.wonder.name}</div>` : ''}
          </div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

// Paleta de "terreno" para territorios SIN dueño — apagada y terrosa.
const TERRAIN_PALETTE = ['#3d5a4a', '#4a4530', '#33465c', '#4a3d38', '#3f4a33', '#3a3550'];
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function terrainColor(id) { return TERRAIN_PALETTE[hashStr(id) % TERRAIN_PALETTE.length]; }

// MAPA POLÍTICO: cada territorio llega del servidor como un polígono suave (t.path, un path
// SVG ya calculado — su celda de Voronoi recortada a la masa de tierra). Aquí solo se pinta:
// mar de fondo, una "sotabase" de tierra continua (el mismo polígono con borde gordo, que
// funde las provincias en un único país con costa), el relleno de cada provincia (niebla si
// su Era no ha empezado, terreno neutro, o el color del dueño) y las fronteras: doradas las
// tuyas, rojas las que puedes atacar, finas y oscuras el resto.
function renderMapSvg(allTerrs) {
  if (!allTerrs.length) return '';
  const mine = new Set(allTerrs.filter(t => t.open && t.owner === myId).map(t => t.id));
  const threatened = new Set();
  allTerrs.forEach(t => {
    if (t.open && mine.has(t.id)) {
      (t.neighbors || []).forEach(nId => {
        const n = state.territories[nId];
        if (n && n.open && !mine.has(nId)) threatened.add(nId);
      });
    }
  });

  const underlay = allTerrs.map(t =>
    `<path d="${t.path}" fill="#3b3450" stroke="#3b3450" stroke-width="10" stroke-linejoin="round" />`).join('');

  const fills = allTerrs.map(t => {
    let fill, op;
    if (!t.open) { fill = '#221f2b'; op = 0.92; }
    else if (t.owner) { fill = colorFor(t.owner); op = 0.62; }
    else { fill = terrainColor(t.id); op = 0.85; }
    const click = t.open ? `focusTerritory('${t.id}')` : `peekTerritory('${t.id}')`;
    return `<path class="terr-shape" data-terr="${t.id}" onclick="${click}" d="${t.path}" fill="${fill}" opacity="${op}" stroke="#171220" stroke-width="1.1" />`;
  }).join('');

  // Fronteras destacadas encima: rojas (atacables) primero, doradas (tuyas) al final.
  const redBorders = allTerrs.filter(t => threatened.has(t.id)).map(t =>
    `<path d="${t.path}" fill="none" stroke="#ff6b6b" stroke-width="1.8" opacity="0.95" style="pointer-events:none;" />`).join('');
  const goldBorders = allTerrs.filter(t => mine.has(t.id)).map(t =>
    `<path d="${t.path}" fill="none" stroke="var(--accent)" stroke-width="2.2" opacity="1" style="pointer-events:none;" />`).join('');

  const labels = allTerrs.map(t => {
    if (!t.open) {
      return `<text x="${t.x}" y="${t.y}" text-anchor="middle" dominant-baseline="central" font-size="11" opacity="0.6"
        paint-order="stroke" stroke="#171220" stroke-width="2.5" stroke-linejoin="round" style="pointer-events:none;">🔒</text>`;
    }
    return `
    <text x="${t.x}" y="${t.y - 3}" text-anchor="middle" dominant-baseline="central" font-size="13"
      paint-order="stroke" stroke="#171220" stroke-width="3" stroke-linejoin="round" style="pointer-events:none;">${t.wonder ? t.wonder.icon : (t.icon || '📍')}</text>
    <text x="${t.x}" y="${t.y + 12}" text-anchor="middle" font-size="9" fill="#fff"
      paint-order="stroke" stroke="#171220" stroke-width="2.5" stroke-linejoin="round" style="pointer-events:none;">${t.armies}${clsEraIcon(t.unitClass, t.era)}</text>`;
  }).join('');

  return `<svg class="map-svg" viewBox="0 0 ${MAP_W} ${MAP_H}" style="width:100%; height:auto; display:block; margin-bottom:4px; border-radius:8px; overflow:hidden;">
    <rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="#101624" />
    ${underlay}
    ${fills}
    ${redBorders}
    ${goldBorders}
    ${labels}
  </svg>
  <div class="map-legend muted">Toca una provincia para ver su ficha &nbsp; 🟡 dorado = tuya &nbsp; 🔴 rojo = puedes atacarla &nbsp; 🔒 = aún sin abrir &nbsp; El icono pequeño es su clase de guarnición.</div>`;
}

function focusTerritory(id) {
  const el = document.getElementById('terr-' + id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 900);
}

function peekTerritory(id) {
  const t = state.territories[id];
  if (!t) return;
  showError(`🔒 Provincia aún sin abrir — se revela al empezar la ${ERA_LABELS[t.era]}.`);
}

// Panel de VÍAS DE VICTORIA: el progreso de cada jugador hacia Dominación (territorios),
// Cultura (maravillas) y Gloria — para que siempre se sepa quién va ganando y por dónde.
function renderVictoryPanel() {
  if (!state.players.length) return '';
  const wondersBy = {};
  Object.values(state.territories).forEach(t => {
    if (t.wonder && t.owner) wondersBy[t.owner] = (wondersBy[t.owner] || 0) + 1;
  });
  return `<div class="card">
    <h2>🏆 Vías de victoria</h2>
    ${state.players.map((p, i) => {
      const terrs = Object.values(state.territories).filter(t => t.open && t.owner === p.id).length;
      return `<div class="victory-row">
        <span class="dot" style="background:${PLAYER_COLORS_RAW[i]}"></span>
        <span class="vname">${p.name}${p.id === myId ? ' (tú)' : ''}</span>
        <span class="vstat">🗺️ ${terrs}/${state.dominationNeeded}</span>
        <span class="vstat">🏛️ ${wondersBy[p.id] || 0}/${state.wondersToWin}</span>
        <span class="vstat">🏆 ${p.gloria}</span>
      </div>`;
    }).join('')}
    <p class="muted victory-note">🗺️ Dominación: controla ${state.dominationNeeded} territorios abiertos y ganas al instante. &nbsp; 🏛️ Cultura: controla ${state.wondersToWin} Maravillas y ganas al instante. &nbsp; 🏆 Gloria: si nadie ha ganado antes, decide al final de la Era III.</p>
  </div>`;
}

// Panel de tropas y mejoras: las 3 clases, qué vence a qué, y la escalera de niveles de cada una.
// Subir de nivel no consume tu orden de la ronda y vale PARA SIEMPRE (todas tus tropas de esa
// clase, en todas las Épocas). Sun Tzu paga 2 Recursos menos.
function renderTroopPanel() {
  const m = me();
  if (!m) return '';
  const myResources = m.resources || 0;
  return `<div class="card">
    <h2>⚔️ Tus tropas y mejoras</h2>
    <p class="muted" style="margin-bottom:10px;">Tienes <b style="color:var(--accent)">${myResources} 💰 Recursos</b> (1 por territorio controlado al final de cada ronda). La rueda de ventajas: 🛡️ Infantería vence a 🐎 Caballería, que vence a 🏹 A distancia, que vence a Infantería (+1 dado). Mejorar una clase es para siempre y no gasta tu orden.</p>
    ${CLASS_KEYS.map(k => {
      const c = clsDef(k);
      const curLevel = (m.troopLevels && m.troopLevels[k]) || 1;
      const nextDef = c.levels.find(l => l.level === curLevel + 1);
      const eraNames = [1, 2, 3].map(e => `${ERA_LABELS[e]}: ${c.byEra[e].icon} ${c.byEra[e].name}`).join(' · ');
      return `
        <div class="troop-tier">
          <div class="troop-tier-head">
            <span class="portrait" style="border-color:var(--accent)">${clsEraIcon(k, state.era)}</span>
            <span><b>${c.clase}</b><br><span class="muted" style="font-size:0.7rem;">${eraNames}</span></span>
          </div>
          <div class="tactica">💡 ${c.tacticaDesc}</div>
          <div class="level-ladder">
            ${c.levels.map(l => {
              const status = l.level < curLevel ? '✅' : l.level === curLevel ? '👉' : '🔒';
              const cls2 = l.level === curLevel ? 'level-current' : '';
              const shownCost = l.cost ? myLevelCost(l.cost) : 0;
              return `<div class="level-row ${cls2}">
                <div class="level-row-title">${status} Nivel ${l.level} — ${l.name}${l.cost ? ` <span class="muted">(coste ${shownCost} 💰${m.leader === 'suntzu' ? ', con descuento de Sun Tzu' : ''})</span>` : ' <span class="muted">(inicial)</span>'}</div>
                <div class="level-row-desc muted">${l.desc}</div>
              </div>`;
            }).join('')}
          </div>
          ${nextDef ? `<button class="secondary level-up-btn" data-cls="${k}" ${myResources < myLevelCost(nextDef.cost) ? 'disabled' : ''}>⬆️ Mejorar a "${nextDef.name}" (${myLevelCost(nextDef.cost)} 💰)${myResources < myLevelCost(nextDef.cost) ? ` — te faltan ${myLevelCost(nextDef.cost) - myResources}` : ''}</button>` : `<p class="muted center" style="margin-bottom:4px;">Nivel máximo alcanzado.</p>`}
        </div>`;
    }).join('')}
  </div>`;
}

// Panel de Maravillas: construir una (si tienes territorio libre de maravilla y Recursos).
function renderWonderPanel() {
  const m = me();
  if (!m) return '';
  const candidates = Object.values(state.territories).filter(t => t.open && t.owner === myId && !t.wonder);
  const myWonders = Object.values(state.territories).filter(t => t.wonder && t.owner === myId);
  return `<div class="card">
    <h2>🏛️ Maravillas</h2>
    <p class="muted" style="margin-bottom:8px;">Cuestan ${state.wonderCost} 💰 y se construyen en un territorio tuyo (una por territorio), sin gastar tu orden. ¡Ojo: si te conquistan el territorio, la Maravilla cambia de dueño! Controlar ${state.wondersToWin} a la vez = victoria por Cultura.</p>
    ${myWonders.length ? `<p class="muted">Tuyas ahora mismo: ${myWonders.map(t => `${t.wonder.icon} ${t.wonder.name} (en ${t.name})`).join(' · ')}</p>` : ''}
    ${candidates.length ? `
      <select id="wonderTerr">${candidates.map(t => `<option value="${t.id}">${t.icon || ''} ${t.name}</option>`).join('')}</select>
      <button class="secondary" id="buildWonderBtn" ${(m.resources || 0) < state.wonderCost ? 'disabled' : ''}>🏛️ Construir Maravilla (${state.wonderCost} 💰)${(m.resources || 0) < state.wonderCost ? ` — te faltan ${state.wonderCost - (m.resources || 0)}` : ''}</button>
    ` : `<p class="muted">Necesitas controlar un territorio sin Maravilla para poder construir.</p>`}
  </div>`;
}

function wirePanels() {
  document.querySelectorAll('.level-up-btn').forEach(btn => {
    btn.onclick = () => call('level_up_troop', { cls: btn.dataset.cls });
  });
  const wBtn = document.getElementById('buildWonderBtn');
  if (wBtn) wBtn.onclick = () => {
    const sel = document.getElementById('wonderTerr');
    if (sel) call('construir_maravilla', { territoryId: sel.value });
  };
}

render();
</script>
</body>
</html>
