<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Banquete</title>
<style>
  :root {
    --bg: #171220; --panel: #2a2233; --accent: #d4a24c; --text: #f2ece0;
    --p0: #e15757; --p1: #4cb8a0; --p2: #e1a940; --p3: #5aa9e6; --p4: #b06ee0; --p5: #6ee0a8;
  }
  * { box-sizing: border-box; }
  @keyframes bgDrift {
    0% { background-position: 0% 0%, 0 0; }
    100% { background-position: 100% 100%, 40px 40px; }
  }
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-1.5deg); }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,162,76,0.0), 0 2px 6px rgba(0,0,0,0.3); }
    50% { box-shadow: 0 0 18px 2px rgba(212,162,76,0.35), 0 2px 6px rgba(0,0,0,0.3); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes diceRoll {
    0% { transform: rotate(0deg) scale(1); }
    30% { transform: rotate(140deg) scale(1.15); }
    60% { transform: rotate(250deg) scale(0.95); }
    100% { transform: rotate(360deg) scale(1); }
  }
  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.6) translateY(6px); }
    40% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.3) translateY(-14px); }
  }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text); min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(212,162,76,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(90,169,230,0.10), transparent 40%),
      linear-gradient(135deg, #1b1622 0%, #171220 50%, #201830 100%);
    background-size: 200% 200%, 60px 60px, 100% 100%;
    animation: bgDrift 30s ease-in-out infinite alternate;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
  h1 { font-size: 1.5rem; text-align: center; color: var(--accent); margin: 12px 0 4px; letter-spacing: 1px; }
  h2 { font-size: 1.1rem; color: var(--accent); margin: 18px 0 8px; }
  .sub { text-align: center; color: #b8afc4; font-size: 0.85rem; margin-bottom: 16px; }
  .card {
    background: linear-gradient(160deg, var(--panel), #241d30);
    border: 1px solid rgba(212,162,76,0.12);
    border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    animation: fadeSlideIn 0.35s ease-out;
  }
  input[type=text], input[type=number] {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4a3f5c; background: #17131d; color: var(--text);
    font-size: 1rem; margin-bottom: 10px;
  }
  select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #4a3f5c; background: #17131d; color: var(--text); margin-bottom: 10px; font-size: 0.95rem;}
  button {
    width: 100%; padding: 13px; border-radius: 8px; border: none; background: var(--accent); color: #1b1622;
    font-weight: 700; font-size: 1rem; margin-bottom: 8px; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; }
  button.secondary { background: #423861; color: var(--text); }
  .option-btn { background: #3a3050; color: var(--text); text-align: left; font-weight: 500; }
  .option-btn.chosen { background: var(--accent); color: #1b1622; animation: glowPulse 1.6s ease-in-out infinite; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; margin-right: 4px; }
  .players-list { display: flex; flex-direction: column; gap: 8px; }
  .player-chip { display: flex; justify-content: space-between; align-items: center; background: #241d2e; padding: 8px 12px; border-radius: 8px; animation: fadeSlideIn 0.3s ease-out; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .territories { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .territory { background: #241d2e; border-radius: 8px; padding: 8px; font-size: 0.8rem; border: 2px solid transparent; transition: border-color 0.3s ease; }
  .era-label { color: var(--accent); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px; margin: 8px 0 4px; text-transform: uppercase; opacity: 0.85; }
  .unit-icons { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 1px; vertical-align: middle; margin-top: 3px; }
  .unit-icon { font-size: 1rem; line-height: 1; display: inline-block; animation: idleFloat 3.2s ease-in-out infinite; }
  .unit-icons b { margin-left: 5px; color: var(--accent); font-size: 0.78rem; font-weight: 700; }
  .map-legend { font-size: 0.7rem; line-height: 1.5; margin-bottom: 10px; }
  .zone-cell { cursor: pointer; }
  .zone-cell:active { opacity: 0.7 !important; }
  @keyframes flashPulse {
    0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,0.3); transform: scale(1); }
    50% { box-shadow: 0 0 0 3px var(--accent), 0 2px 10px rgba(0,0,0,0.4); transform: scale(1.03); }
  }
  .territory.flash { animation: flashPulse 0.9s ease-in-out; }
  .log { font-size: 0.85rem; color: #cbc2d9; max-height: 160px; overflow-y: auto; }
  .log div { padding: 4px 0; border-bottom: 1px solid #382e48; animation: fadeSlideIn 0.25s ease-out; }
  .timer { text-align: center; font-size: 0.85rem; color: var(--accent); margin-bottom: 8px; }
  .center { text-align: center; }
  .muted { color: #9d92ae; font-size: 0.85rem; }
  .flavor { font-style: italic; color: #cbc2d9; line-height: 1.4; }
  .rank { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #241d2e; border-radius: 8px; margin-bottom: 6px; }
  .rank.first { border: 2px solid var(--accent); animation: glowPulse 1.8s ease-in-out infinite; }
  #err { color: #ff8080; text-align: center; min-height: 20px; font-size: 0.85rem; }

  /* Retratos tipo "consejero" para arquetipos y personajes */
  .portrait {
    width: 46px; height: 46px; min-width: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    border: 2px solid rgba(255,255,255,0.15);
    animation: idleFloat 4.5s ease-in-out infinite;
  }
  .portrait.big { width: 68px; height: 68px; font-size: 2.1rem; }
  .portrait-row { display: flex; align-items: center; gap: 12px; }
  .arch-card {
    display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px;
  }
  .arch-card .info { flex: 1; }
  .arch-card .name { font-weight: 700; margin-bottom: 2px; }
  .arch-card .desc { font-weight: 400; font-size: 0.8rem; opacity: 0.85; }

  .char-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; animation: fadeSlideIn 0.4s ease-out; }
  .char-item .portrait { width: 34px; height: 34px; min-width: 34px; font-size: 1.1rem; }

  /* Marco "cuadro pintado" para los retratos de Personaje: si hay una ilustración real en
     public/images/ se muestra encima; si no, se ve el icono con el mismo marco ornamentado. */
  .frame { position: relative; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    box-shadow: 0 0 0 2px #17131d, 0 0 0 4px var(--accent), 0 3px 8px rgba(0,0,0,0.4);
    animation: idleFloat 4.5s ease-in-out infinite; background: #3a3050; }
  .frame::after { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 48%, transparent 66%);
    background-size: 220% 220%; animation: sheen 4s ease-in-out infinite; pointer-events: none; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .frame.medium { width: 46px; height: 46px; font-size: 1.5rem; }
  .frame.small { width: 34px; height: 34px; font-size: 1.1rem; }
  .frame.big { width: 78px; height: 78px; font-size: 2.2rem; }
  @keyframes sheen {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  /* Barra de progreso para los temporizadores */
  .progress-wrap { margin-bottom: 10px; }
  .progress-track { width: 100%; height: 8px; border-radius: 6px; background: #241d2e; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #f0c878); transition: width 1s linear; }

  /* Animación de dados durante la resolución de combate */
  .dice-row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  .die { width: 26px; height: 26px; border-radius: 6px; background: #3a3050; border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    animation: diceRoll 0.5s ease-out; }

  .sparkle-emoji { display: inline-block; animation: sparkle 1.1s ease-out; }

  /* Monumento de fondo: cambia según la Era. Si hay una ilustración real en
     public/images/ se ve encima; si no, se ve el dibujo vectorial de reserva. */
  #monumentBg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: 0.16; }
  #monumentBg svg, #monumentBg img { position: absolute; bottom: -4%; left: 50%; transform: translateX(-50%);
    width: 130%; max-width: 900px; animation: monumentPan 40s ease-in-out infinite alternate; }
  #monumentBg img { object-fit: cover; height: 60%; width: 100%; max-width: none; }
  @keyframes monumentPan {
    0% { transform: translateX(-52%) scale(1); }
    100% { transform: translateX(-48%) scale(1.04); }
  }
  #app { position: relative; z-index: 1; }

  /* Barra persistente de sala: código, reiniciar (anfitrión) y salir */
  #roomBar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 2px 10px; font-size: 0.8rem; }
  #roomBar .roomBarBtns { display: flex; gap: 6px; }
  button.tiny { width: auto; padding: 6px 10px; font-size: 0.78rem; margin-bottom: 0; border-radius: 20px; }
</style>
</head>
<body>
<div id="monumentBg" aria-hidden="true"></div>
<div id="app">
  <h1>🍷 EL BANQUETE</h1>
  <div class="sub">Estrategia, historia y brindis — para 2 a 6 jugadores</div>
  <div id="roomBar"></div>
  <div id="err"></div>
  <div id="screen"></div>
</div>

<script>
let myId = localStorage.getItem('banquete_playerId') || null;
let state = null;
let joinedName = '';
const screen = document.getElementById('screen');
const errBox = document.getElementById('err');

const PLAYER_COLORS = ['var(--p0)', 'var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)', 'var(--p5)'];

function colorFor(playerId) {
  if (!state) return '#666';
  const idx = state.players.findIndex(p => p.id === playerId);
  return idx >= 0 ? PLAYER_COLORS[idx] : '#666';
}
function nameFor(playerId) {
  if (!state) return '';
  const p = state.players.find(p => p.id === playerId);
  return p ? p.name : '';
}
function troopWord(era, count) {
  const t = state && state.troopTypes && state.troopTypes[era];
  if (!t) return count === 1 ? 'legión' : 'legiones';
  return count === 1 ? t.singular : t.plural;
}
function troopIcon(era) {
  const t = state && state.troopTypes && state.troopTypes[era];
  return (t && t.icon) || '🛡️';
}
// Fila visual de unidades: repite el icono de tropa (según la Época del territorio) una vez por
// soldado, hasta un máximo legible, y añade el número exacto — así el tablero se ve con "soldados"
// encima en vez de solo una cifra suelta.
function unitBadge(era, count) {
  const icon = troopIcon(era);
  const n = Math.max(0, count || 0);
  if (!n) return `<span class="unit-icons muted">sin tropas</span>`;
  const cap = 6;
  const shown = Math.min(n, cap);
  const icons = Array.from({ length: shown }, (_, i) => `<span class="unit-icon" style="animation-delay:${(i * 0.15).toFixed(2)}s">${icon}</span>`).join('');
  return `<span class="unit-icons">${icons}<b>×${n}</b></span>`;
}
// Marco de "cuadro pintado" para un Personaje: muestra la ilustración real si existe en
// public/images/<portrait>; si no está (o falla al cargar), se ve el icono con el mismo marco.
function portraitFrame(character, size) {
  const sizeClass = size || 'medium';
  const img = character.portrait ? `<img src="/images/${character.portrait}" alt="" onerror="this.remove()">` : '';
  return `<span class="frame ${sizeClass}">${img}<span class="fallback">${character.icon || '👑'}</span></span>`;
}

function showError(msg) {
  errBox.textContent = msg;
  setTimeout(() => { errBox.textContent = ''; }, 3500);
}

function handleNotice(notice) {
  if (!notice) return;
  if (notice.type === 'spy_result') {
    alert(`Espionaje sobre ${notice.target}:\n${notice.info}`);
  }
}

// Dibujo vectorial de reserva para el monumento de fondo de cada Era (siempre disponible,
// no depende de ninguna imagen externa). Si además existe public/images/monumento_eraN.png,
// esa ilustración real se superpone encima automáticamente.
const MONUMENT_SVG = {
  1: `<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="var(--accent)">
    <polygon points="200,15 350,95 50,95"/>
    <rect x="45" y="95" width="310" height="10"/>
    ${[0,1,2,3,4,5,6].map(i => `<rect x="${60 + i*40}" y="105" width="16" height="75"/>`).join('')}
    <rect x="40" y="180" width="320" height="16"/>
  </svg>`,
  2: `<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="var(--accent)">
    <rect x="50" y="120" width="300" height="60"/>
    <circle cx="200" cy="108" r="52"/>
    <rect x="172" y="150" width="56" height="35"/>
    <rect x="66" y="55" width="14" height="130"/>
    <polygon points="66,55 80,55 73,35"/>
    <rect x="320" y="55" width="14" height="130"/>
    <polygon points="320,55 334,55 327,35"/>
  </svg>`,
  3: `<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="var(--accent)">
    <rect x="60" y="130" width="140" height="50"/>
    <polygon points="130,60 200,130 60,130"/>
    <ellipse cx="130" cy="60" rx="30" ry="14"/>
    <rect x="210" y="90" width="150" height="90"/>
    <polygon points="210,150 250,120 320,120 360,150"/>
    <polygon points="230,120 250,90 320,90 340,120"/>
  </svg>`,
};

function renderMonumentBg() {
  const bg = document.getElementById('monumentBg');
  if (!bg) return;
  const era = (state && state.era) || 1;
  if (bg.dataset.era === String(era)) return; // ya está pintado para esta Era
  bg.dataset.era = String(era);
  const file = state && state.eraInfo && state.eraInfo.monumento ? state.eraInfo.monumento : `monumento_era${era}.png`;
  bg.innerHTML = `
    ${MONUMENT_SVG[era] || MONUMENT_SVG[1]}
    <img src="/images/${file}" alt="" onerror="this.remove()">
  `;
}
renderMonumentBg();

function renderRoomBar() {
  const bar = document.getElementById('roomBar');
  if (!bar) return;
  if (!state || !state.code) { bar.innerHTML = ''; return; }
  const isHost = state.players[0] && state.players[0].id === myId;
  bar.innerHTML = `
    <span class="muted">Sala ${state.code}</span>
    <span class="roomBarBtns">
      ${isHost ? `<button class="tiny secondary" id="restartBtn">🔄 Reiniciar</button>` : ''}
      <button class="tiny secondary" id="exitBtn">🚪 Salir</button>
    </span>
  `;
  const restartBtn = document.getElementById('restartBtn');
  if (restartBtn) restartBtn.onclick = () => call('restart_room');
  document.getElementById('exitBtn').onclick = () => {
    localStorage.removeItem('banquete_playerId');
    location.reload();
  };
}

function call(action, payload) {
  return fetch('/api/' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...(payload || {}), playerId: myId }),
  }).then((r) => r.json()).then((r) => { if (r && r.error) showError(r.error); return r; });
}

let es = null;
function connectStream() {
  if (es) es.close();
  es = new EventSource('/events?playerId=' + encodeURIComponent(myId));
  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleNotice(data.notice);
    state = data;
    render();
  };
}

async function boot() {
  if (!myId) {
    const r = await fetch('/api/new_id').then((x) => x.json());
    myId = r.playerId;
    localStorage.setItem('banquete_playerId', myId);
  }
  connectStream();
  render();
}
boot();

function render() {
  renderRoomBar();
  renderMonumentBg();
  if (!state) return renderConnect();
  switch (state.phase) {
    case 'lobby': return renderLobby();
    case 'era_intro': return renderEraIntro();
    case 'orders': return renderOrders();
    case 'resolve': return renderResolve();
    case 'desafio': return renderDesafio();
    case 'simposio': return renderSimposio();
    case 'fin': return renderFin();
    default: return renderConnect();
  }
}

function renderConnect() {
  screen.innerHTML = `
    <div class="card">
      <h2>Entrar en una partida</h2>
      <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="20">
    </div>
    <div class="card">
      <h2>Crear sala nueva</h2>
      <p class="muted">¿Cuántos jugadores en total (contándote a ti)?</p>
      <select id="maxPlayersInput">
        <option value="2">2 jugadores</option>
        <option value="3" selected>3 jugadores</option>
        <option value="4">4 jugadores</option>
        <option value="5">5 jugadores</option>
        <option value="6">6 jugadores</option>
      </select>
      <p class="muted">¿Cuántos de ellos son bots (para testear solo/a)?</p>
      <select id="botsInput"></select>
      <button id="createBtn">Crear sala nueva</button>
    </div>
    <div class="card">
      <h2>Unirte a una sala</h2>
      <input type="text" id="codeInput" placeholder="Código de sala (ej. LYNX)" maxlength="4" style="text-transform:uppercase">
      <button class="secondary" id="joinBtn">Unirme</button>
    </div>
  `;
  const maxPlayersInput = document.getElementById('maxPlayersInput');
  const botsInput = document.getElementById('botsInput');
  function refreshBotsOptions() {
    const total = parseInt(maxPlayersInput.value, 10);
    botsInput.innerHTML = '';
    for (let i = 0; i <= total - 1; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i === 0 ? `Ningún bot (${total} humanos)` : `${i} bot${i > 1 ? 's' : ''} (${total - i} humano${total - i > 1 ? 's' : ''})`;
      botsInput.appendChild(opt);
    }
    // Por defecto, sin bots: así quien crea la sala para jugar con amigos reales no se
    // encuentra con que los bots ya han ocupado los sitios y sus amigos no pueden entrar.
    // Quien quiera probar el juego solo/a sube este número a mano.
    botsInput.value = 0;
  }
  maxPlayersInput.onchange = refreshBotsOptions;
  refreshBotsOptions();

  document.getElementById('createBtn').onclick = () => {
    joinedName = document.getElementById('nameInput').value || 'Jugador';
    call('create_room', {
      name: joinedName,
      maxPlayers: parseInt(maxPlayersInput.value, 10),
      botsWanted: parseInt(botsInput.value, 10),
    });
  };
  document.getElementById('joinBtn').onclick = () => {
    joinedName = document.getElementById('nameInput').value || 'Jugador';
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) { showError('Escribe el código de la sala.'); return; }
    call('join_room', { code, name: joinedName });
  };
}

function renderLobby() {
  const isHost = state.players[0] && state.players[0].id === myId;
  const me = state.players.find(p => p.id === myId);
  const archOptions = Object.keys(state.archetypes);
  screen.innerHTML = `
    <div class="card center">
      <div class="muted">Código de sala</div>
      <h1 style="margin:4px 0;">${state.code}</h1>
      <div class="muted">Compártelo con tus jugadores humanos (los bots ya están dentro)</div>
    </div>
    <div class="card">
      <h2>Jugadores (${state.players.length}/${state.maxPlayers})</h2>
      <div class="players-list">
        ${state.players.map((p, i) => `
          <div class="player-chip">
            <span class="portrait-row">
              <span class="portrait" style="background:${p.archetype ? state.archetypes[p.archetype].color : '#3a3050'}22;border-color:${PLAYER_COLORS[i]}">${p.archetype ? state.archetypes[p.archetype].icon : (p.isBot ? '🤖' : '👤')}</span>
              <span>${p.isBot ? '🤖 ' : ''}${p.name}${p.id === myId ? ' (tú)' : ''}</span>
            </span>
            <span class="muted">${p.archetype ? state.archetypes[p.archetype].name : 'eligiendo…'}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Elige tu Arquetipo</h2>
      ${archOptions.map(a => {
        const arch = state.archetypes[a];
        const takenBy = state.players.find(p => p.archetype === a && p.id !== myId);
        const mine = me && me.archetype === a;
        return `<button class="option-btn arch-card ${mine ? 'chosen' : ''}" ${takenBy ? 'disabled' : ''} data-arch="${a}">
          <span class="portrait" style="background:${arch.color}22;border-color:${arch.color}">${arch.icon}</span>
          <span class="info">
            <div class="name">${arch.name} ${takenBy ? '(ocupado)' : ''}</div>
            <div class="desc">${arch.desc}</div>
          </span>
        </button>`;
      }).join('')}
    </div>
    ${isHost ? `<button id="startBtn" ${state.players.length !== state.maxPlayers ? 'disabled' : ''}>${state.players.length !== state.maxPlayers ? `Esperando jugadores (${state.players.length}/${state.maxPlayers})` : 'Empezar partida'}</button>` : `<div class="muted center">Esperando a que el anfitrión empiece la partida…</div>`}
  `;
  document.querySelectorAll('[data-arch]').forEach(btn => {
    btn.onclick = () => call('choose_archetype', { archetype: btn.dataset.arch });
  });
  const startBtn = document.getElementById('startBtn');
  if (startBtn) startBtn.onclick = () => call('start_game');
}

function renderEraIntro() {
  screen.innerHTML = `
    <div class="card">
      <h2>${state.eraInfo.titulo}</h2>
      <p class="flavor">${state.eraInfo.flavor}</p>
    </div>
    ${renderBoard()}
    <button id="cont">Continuar</button>
  `;
  document.getElementById('cont').onclick = () => call('continue');
}

function renderOrders() {
  const me = state.players.find(p => p.id === myId);
  const submitted = state.ordersSubmitted.includes(myId);
  const myTerritories = Object.values(state.territories).filter(t => t.open && t.owner === myId);
  const otherPlayers = state.players.filter(p => p.id !== myId);

  // Objetivos alcanzables: territorios libres en la 1ª ronda de la Era (se colonizan desde
  // la reserva), o vecinos de un territorio tuyo con legiones de sobra (ataque "de verdad").
  const isBootstrapRound = state.round === 1;
  const bootstrapTargets = isBootstrapRound
    ? Object.values(state.territories).filter(t => t.open && t.era === state.era && !t.owner)
    : [];
  const reachableIds = new Set();
  myTerritories.forEach(t => {
    if (t.armies > 1) {
      t.neighbors.forEach(nId => {
        const n = state.territories[nId];
        if (n && n.open && n.owner !== myId) reachableIds.add(nId);
      });
    }
  });
  const attackMap = new Map();
  bootstrapTargets.forEach(t => attackMap.set(t.id, t));
  reachableIds.forEach(id => attackMap.set(id, state.territories[id]));
  const attackable = [...attackMap.values()];

  // Antes de reconstruir la pantalla, guardamos lo que estuvieras rellenando: si otro
  // jugador (o un bot) envía su orden mientras tú sigues eligiendo, nos llega un aviso
  // por el stream y esto se vuelve a renderizar entero — sin esto, perderías tu selección.
  const prevOrderType = document.getElementById('orderType')?.value;
  const prevTargetTerr = document.getElementById('targetTerr')?.value;
  const prevFromTerr = document.getElementById('fromTerr')?.value;
  const prevAmount = document.getElementById('amount')?.value;
  const prevTargetPlayer = document.getElementById('targetPlayer')?.value;

  screen.innerHTML = `
    ${renderBoard()}
    <div class="card">
      <h2>Tus órdenes — Ronda ${state.round}</h2>
      <p class="muted">Reserva disponible: ${me.reserve} ${troopWord(state.era, me.reserve)}</p>
      ${submitted ? `<p class="center">Orden enviada. Esperando a los demás (${state.ordersSubmitted.length}/${state.players.length})…</p>` : `
      <select id="orderType">
        <option value="atacar">⚔️ Atacar</option>
        <option value="reforzar">🛡️ Reforzar</option>
        <option value="reclutar">👑 Reclutar Personaje</option>
        <option value="espiar">🕵️ Espiar</option>
      </select>
      <div id="orderFields"></div>
      <button id="sendOrder">Enviar orden</button>
      `}
    </div>
    ${state.you.characters.length ? `<div class="card"><h2>Tus Personajes</h2>${state.you.characters.map(c => `
      <div class="char-item">
        ${portraitFrame(c, 'small')}
        <span class="muted"><b style="color:var(--text)">${c.name}</b> — ${c.flavor}</span>
      </div>`).join('')}</div>` : ''}
  `;
  if (submitted) return;

  function renderAttackFrom() {
    const targetEl = document.getElementById('targetTerr');
    const wrap = document.getElementById('attackFromWrap');
    if (!targetEl || !wrap) return;
    const target = state.territories[targetEl.value];
    const isBootstrap = isBootstrapRound && target.era === state.era && !target.owner;
    if (isBootstrap) {
      wrap.innerHTML = `
        <p class="muted">Territorio libre — desembarcas directamente desde tu reserva.</p>
        <input type="text" id="amount" placeholder="${troopWord(target.era, 2)} desde tu reserva (máx ${me.reserve})">
      `;
    } else {
      const sources = myTerritories.filter(t => t.armies > 1 && t.neighbors.includes(target.id));
      if (!sources.length) {
        wrap.innerHTML = `<p class="muted">No tienes ningún territorio con ${troopWord(target.era, 2)} de sobra junto a ${target.name}.</p>`;
      } else {
        wrap.innerHTML = `
          <select id="fromTerr">${sources.map(t => `<option value="${t.id}">${t.icon || ''} ${t.name} (${t.armies} ${troopWord(t.era, t.armies)})</option>`).join('')}</select>
          <input type="text" id="amount" placeholder="${troopWord(target.era, 2)} a enviar (déjate al menos 1 en el origen)">
        `;
      }
    }
  }

  function renderFields() {
    const type = document.getElementById('orderType').value;
    const fields = document.getElementById('orderFields');
    if (type === 'atacar') {
      if (!attackable.length) {
        fields.innerHTML = `<p class="muted">No tienes ningún objetivo alcanzable este turno (te falta un territorio vecino con tropas de sobra).</p>`;
        return;
      }
      fields.innerHTML = `
        <select id="targetTerr">${attackable.map(t => `<option value="${t.id}">${t.icon || ''} ${t.name} (${t.owner ? nameFor(t.owner) : 'neutral'}, ${t.armies} ${troopWord(t.era, t.armies)})</option>`).join('')}</select>
        <div id="attackFromWrap"></div>
      `;
      document.getElementById('targetTerr').onchange = renderAttackFrom;
      renderAttackFrom();
    } else if (type === 'reforzar') {
      fields.innerHTML = myTerritories.length ? `
        <select id="targetTerr">${myTerritories.map(t => `<option value="${t.id}">${t.icon || ''} ${t.name} (${t.armies} ${troopWord(t.era, t.armies)})</option>`).join('')}</select>
        <input type="text" id="amount" placeholder="${troopWord(state.era, 2)} a añadir (máx ${me.reserve})">
      ` : `<p class="muted">Aún no controlas ningún territorio.</p>`;
    } else if (type === 'espiar') {
      fields.innerHTML = `<select id="targetPlayer">${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
    } else {
      fields.innerHTML = `<p class="muted">Robas 1 personaje al azar del mazo de esta Era.</p>`;
    }
  }
  document.getElementById('orderType').onchange = renderFields;
  if (prevOrderType && [...document.getElementById('orderType').options].some(o => o.value === prevOrderType)) {
    document.getElementById('orderType').value = prevOrderType;
  }
  renderFields();

  // Restauramos las selecciones más finas ahora que existen los campos correspondientes.
  const typeNow = document.getElementById('orderType').value;
  if (typeNow === 'atacar') {
    const targetSel = document.getElementById('targetTerr');
    if (targetSel && prevTargetTerr && [...targetSel.options].some(o => o.value === prevTargetTerr)) {
      targetSel.value = prevTargetTerr;
      renderAttackFrom();
      const fromSel = document.getElementById('fromTerr');
      if (fromSel && prevFromTerr && [...fromSel.options].some(o => o.value === prevFromTerr)) fromSel.value = prevFromTerr;
    }
  } else if (typeNow === 'reforzar') {
    const targetSel = document.getElementById('targetTerr');
    if (targetSel && prevTargetTerr && [...targetSel.options].some(o => o.value === prevTargetTerr)) targetSel.value = prevTargetTerr;
  } else if (typeNow === 'espiar') {
    const targetSel = document.getElementById('targetPlayer');
    if (targetSel && prevTargetPlayer) targetSel.value = prevTargetPlayer;
  }
  const amountElRestore = document.getElementById('amount');
  if (amountElRestore && prevAmount) amountElRestore.value = prevAmount;

  document.getElementById('sendOrder').onclick = () => {
    const type = document.getElementById('orderType').value;
    let order = { type };
    if (type === 'atacar') {
      const targetEl = document.getElementById('targetTerr');
      if (!targetEl) { showError('No tienes ningún objetivo alcanzable.'); return; }
      const amountEl = document.getElementById('amount');
      if (!amountEl) { showError('Elige un territorio de origen con legiones de sobra.'); return; }
      order.to = targetEl.value;
      order.amount = parseInt(amountEl.value) || 0;
      const fromEl = document.getElementById('fromTerr');
      if (fromEl) order.from = fromEl.value;
    } else if (type === 'reforzar') {
      if (!myTerritories.length) return;
      order.territoryId = document.getElementById('targetTerr').value;
      order.amount = parseInt(document.getElementById('amount').value) || 0;
    } else if (type === 'espiar') {
      order.targetId = document.getElementById('targetPlayer').value;
    }
    call('submit_order', { order });
  };
}

function renderResolve() {
  const isHost = state.players[0] && state.players[0].id === myId;
  const hasCombat = (state.resolveLog || []).some(l => l.includes('ataca') || l.includes('conquista'));
  screen.innerHTML = `
    <div class="card">
      <h2>Resultado de la Ronda ${state.round}</h2>
      ${hasCombat ? `<div class="dice-row"><div class="die">⚔️</div><div class="die">🎲</div><div class="die">🎲</div></div>` : ''}
      <div class="log">${(state.resolveLog || []).map(l => `<div>${l}</div>`).join('')}</div>
    </div>
    ${renderBoard()}
    ${isHost ? `<button id="cont">Continuar</button>` : `<div class="muted center">Esperando al anfitrión…</div>`}
  `;
  const btn = document.getElementById('cont');
  if (btn) btn.onclick = () => call('continue');
}

function renderDesafio() {
  const d = state.desafio;
  const responded = state.desafioResponses.includes(myId);
  let optionsHtml = '';
  if (d.tipo === 'votacion') {
    const others = state.players.filter(p => p.id !== myId);
    optionsHtml = others.map(p => `<button class="option-btn" data-c="${p.id}" ${responded ? 'disabled' : ''}>${p.name}</button>`).join('');
  } else {
    optionsHtml = d.opciones.map((opt, i) => `<button class="option-btn" data-c="${i}" ${responded ? 'disabled' : ''}>${opt}</button>`).join('');
  }
  screen.innerHTML = `
    <div class="card">
      <h2>🥂 Desafío: ${d.titulo}</h2>
      <p>${d.texto}</p>
      ${optionsHtml}
      <p class="muted">Respondido: ${state.desafioResponses.length}/${state.players.length}</p>
    </div>
  `;
  if (!responded) {
    document.querySelectorAll('[data-c]').forEach(btn => {
      btn.onclick = () => {
        let choice = btn.dataset.c;
        if (d.tipo !== 'votacion') choice = parseInt(choice);
        call('submit_desafio_choice', { choice });
      };
    });
  }
}

function renderSimposio() {
  const isHost = state.players[0] && state.players[0].id === myId;
  screen.innerHTML = `
    <div class="card">
      <h2>🏛 Simposio — Fin de la Era ${state.era}</h2>
      ${(state.simposioResult || []).map(r => `<div class="rank"><span>${r.name}</span><span>${r.territorios} territorio(s) → +${r.ganancia} Gloria</span></div>`).join('')}
    </div>
    <div class="card">
      <h2>Gloria total</h2>
      ${[...state.players].sort((a,b)=>b.gloria-a.gloria).map(p => `<div class="rank"><span>${p.name}</span><span>${p.gloria} 🏆</span></div>`).join('')}
    </div>
    ${isHost ? `<button id="cont">${state.era < 3 ? 'Comenzar siguiente Era' : 'Ver resultado final'}</button>` : `<div class="muted center">Esperando al anfitrión…</div>`}
  `;
  const btn = document.getElementById('cont');
  if (btn) btn.onclick = () => call('continue');
}

function renderFin() {
  const isHost = state.players[0] && state.players[0].id === myId;
  screen.innerHTML = `
    <div class="card center">
      <h2>🏆 Fin de la partida</h2>
      ${state.finalResult.map((r, i) => `
        <div class="rank ${i === 0 ? 'first' : ''}">
          <span>${i === 0 ? '👑 ' : ''}${r.name}</span>
          <span>${r.gloria} Gloria · ${r.territorios} territorios</span>
        </div>`).join('')}
      <p class="muted" style="margin-top:12px;">¡Brindad por quien ha ganado y otra por quien ha perdido!</p>
    </div>
    ${isHost ? `<button id="restartFromFin">🔄 Jugar otra vez con el mismo grupo (mapa nuevo)</button>` : `<div class="muted center">Cuando el anfitrión reinicie, seguiréis todos en la misma sala.</div>`}
  `;
  const btn = document.getElementById('restartFromFin');
  if (btn) btn.onclick = () => call('restart_room');
}

const ERA_LABELS = { 1: 'Era I', 2: 'Era II', 3: 'Era III' };
function renderBoard() {
  const eras = [1, 2, 3];
  const openTerrs = Object.values(state.territories).filter(t => t.open);
  return `<div class="card"><h2>Tablero</h2>
    ${renderMapSvg(openTerrs)}
    ${eras.map(e => {
      const terrs = openTerrs.filter(t => t.era === e);
      if (!terrs.length) return '';
      return `<div class="era-label">${ERA_LABELS[e]} · ${troopIcon(e)} ${troopWord(e, 2)}</div>
      <div class="territories" style="margin-bottom:8px;">
        ${terrs.map(t => `
          <div class="territory" id="terr-${t.id}" style="border-color:${t.owner ? colorFor(t.owner) : '#4a3f5c'}">
            <b>${t.icon || ''} ${t.name}</b><br>
            <span class="muted">${t.owner ? nameFor(t.owner) : 'Neutral'}${t.owner === myId ? ' · tuyo' : ''}</span><br>
            ${unitBadge(e, t.armies)}
          </div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

// Hash simple y determinista (mismo id -> mismo número siempre) solo para dar un pequeño
// desplazamiento vertical a cada nodo del mapa, así las filas no quedan perfectamente rectas.
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

// Coloca cada territorio en (x,y): Era I en la fila de arriba, y cada territorio de una Era
// posterior se sitúa cerca de su "puente" (el vecino de la Era anterior del que viene) — así los
// territorios conectados quedan geométricamente cerca, y el mapa se lee como una zona que crece
// hacia abajo en vez de una fila de puntos sueltos sin relación entre sí.
function computeMapLayout(openTerrs, W, rowH, padTop) {
  const byId = {};
  openTerrs.forEach(t => { byId[t.id] = t; });
  const byEra = { 1: [], 2: [], 3: [] };
  openTerrs.forEach(t => { if (byEra[t.era]) byEra[t.era].push(t); });
  const eras = [1, 2, 3].filter(e => byEra[e].length);

  const pos = {};
  eras.forEach((e, rowIdx) => {
    const list = byEra[e];
    const inEra = new Set(list.map(t => t.id));
    let order;
    if (rowIdx === 0) {
      // Primera fila: recorrido en anchura por el grafo de esa Era, para que los vecinos
      // queden próximos en el eje X.
      order = [];
      const visited = new Set();
      const queue = [list[0].id];
      visited.add(list[0].id);
      while (queue.length) {
        const id = queue.shift();
        order.push(byId[id]);
        (byId[id].neighbors || []).forEach(nId => {
          if (inEra.has(nId) && !visited.has(nId)) { visited.add(nId); queue.push(nId); }
        });
      }
      list.forEach(t => { if (!visited.has(t.id)) { visited.add(t.id); order.push(t); } });
    } else {
      // Filas siguientes: cada territorio se ordena según la X de su vecino de la Era anterior.
      order = [...list].sort((a, b) => {
        const pa = (a.neighbors || []).find(nId => byId[nId] && byId[nId].era === a.era - 1);
        const pb = (b.neighbors || []).find(nId => byId[nId] && byId[nId].era === b.era - 1);
        const xa = pa && pos[pa] ? pos[pa].x : W / 2;
        const xb = pb && pos[pb] ? pos[pb].x : W / 2;
        return xa - xb;
      });
    }
    const y = padTop + rowIdx * rowH;
    order.forEach((t, i) => {
      const x = W * (i + 1) / (order.length + 1);
      const jitter = (hashStr(t.id) % 5) - 2;
      pos[t.id] = { x, y: y + jitter * 3, t };
    });
  });
  return { pos, eras };
}

// Paleta de "terreno" para territorios SIN dueño — apagada y terrosa, para que se note que no es
// el color vivo de ningún jugador. Así el mapa se ve con color desde el primer turno (como un mapa
// de verdad), no solo después de que alguien conquiste algo.
const TERRAIN_PALETTE = ['#3d5a4a', '#4a4530', '#33465c', '#4a3d38', '#3f4a33', '#3a3550'];
function terrainColor(id) { return TERRAIN_PALETTE[hashStr(id) % TERRAIN_PALETTE.length]; }

// Mosaico de "tierra fraccionada" — SIN círculos ni nodos: cada celda de una rejilla se colorea
// según el territorio abierto más cercano (su color de terreno fijo si es neutral, o el color de
// su dueño si lo han conquistado), formando fragmentos irregulares tipo mapa político. La frontera
// entre dos fragmentos distintos se traza siempre; si uno de los dos lados es tuyo se traza en
// dorado, y si uno de los dos lados es territorio que puedes atacar (frontera con un rival o zona
// libre junto a lo tuyo) se traza en rojo — así no hace falta ningún círculo para ver ni de quién
// es cada fragmento ni cuáles puedes conquistar.
function renderTerritoryShading(pos, W, H, mine, threatened) {
  const cell = 14;
  const nodes = Object.values(pos);
  if (!nodes.length) return '';
  const cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
  const zoneAt = [];
  for (let ry = 0; ry < rows; ry++) {
    const row = [];
    for (let cx = 0; cx < cols; cx++) {
      const px = cx * cell + cell / 2, py = ry * cell + cell / 2;
      let best = nodes[0], bestDist = Infinity;
      for (const n of nodes) {
        const dx = n.x - px, dy = n.y - py;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = n; }
      }
      row.push(best.t);
    }
    zoneAt.push(row);
  }
  const edgeColor = (a, b) => {
    if (a.owner === myId || b.owner === myId) return ['var(--accent)', 2.2, 1];
    if (threatened.has(a.id) || threatened.has(b.id)) return ['#ff6b6b', 1.8, 0.95];
    return ['#171220', 1.1, 0.7];
  };
  let rects = '', borders = '';
  for (let ry = 0; ry < rows; ry++) {
    for (let cx = 0; cx < cols; cx++) {
      const t = zoneAt[ry][cx];
      const color = t.owner ? colorFor(t.owner) : terrainColor(t.id);
      const op = t.owner ? 0.5 : 0.34;
      rects += `<rect class="zone-cell" data-terr="${t.id}" onclick="focusTerritory('${t.id}')" x="${cx * cell}" y="${ry * cell}" width="${cell + 0.6}" height="${cell + 0.6}" fill="${color}" opacity="${op}" />`;
      if (cx < cols - 1 && zoneAt[ry][cx + 1].id !== t.id) {
        const [stroke, w, op2] = edgeColor(t, zoneAt[ry][cx + 1]);
        borders += `<line class="zone-border" x1="${(cx + 1) * cell}" y1="${ry * cell}" x2="${(cx + 1) * cell}" y2="${(ry + 1) * cell}" stroke="${stroke}" stroke-width="${w}" opacity="${op2}" />`;
      }
      if (ry < rows - 1 && zoneAt[ry + 1][cx].id !== t.id) {
        const [stroke, w, op2] = edgeColor(t, zoneAt[ry + 1][cx]);
        borders += `<line class="zone-border" x1="${cx * cell}" y1="${(ry + 1) * cell}" x2="${(cx + 1) * cell}" y2="${(ry + 1) * cell}" stroke="${stroke}" stroke-width="${w}" opacity="${op2}" />`;
      }
    }
  }
  return rects + borders;
}

// Mapa visual fraccionado — SIN círculos ni nodos de grafo: solo fragmentos de terreno coloreado
// (territorio pintado desde el primer turno; al conquistarlo se repinta con el color del jugador)
// con el icono y las tropas escritos directamente encima de cada fragmento. La frontera de cada
// fragmento se pinta en dorado si es tuyo, en rojo si es territorio que puedes atacar (frontera
// con un rival, o zona libre pegada a lo tuyo), y en gris oscuro en el resto de casos.
function renderMapSvg(openTerrs) {
  if (!openTerrs.length) return '';
  const W = 300, rowH = 78, padTop = 34;
  const { pos, eras } = computeMapLayout(openTerrs, W, rowH, padTop);
  const H = padTop + rowH * eras.length + 20;

  const mine = new Set(openTerrs.filter(t => t.owner === myId).map(t => t.id));
  const threatened = new Set();
  openTerrs.forEach(t => {
    if (mine.has(t.id)) (t.neighbors || []).forEach(nId => { if (!mine.has(nId)) threatened.add(nId); });
  });

  const labels = Object.values(pos).map(({ x, y, t }) => `
    <text x="${x}" y="${y - 1}" text-anchor="middle" dominant-baseline="central" font-size="14"
      paint-order="stroke" stroke="#171220" stroke-width="3" stroke-linejoin="round" style="pointer-events:none;">${t.icon || '📍'}</text>
    <text x="${x}" y="${y + 15}" text-anchor="middle" font-size="9" fill="#fff"
      paint-order="stroke" stroke="#171220" stroke-width="2.5" stroke-linejoin="round" style="pointer-events:none;">${t.armies}${troopIcon(t.era)}</text>`).join('');

  return `<svg class="map-svg" viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block; margin-bottom:4px; border-radius:8px; overflow:hidden;">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#1b1622" />
    ${renderTerritoryShading(pos, W, H, mine, threatened)}
    ${labels}
  </svg>
  <div class="map-legend muted">Toca un fragmento para ver su ficha &nbsp; 🟡 borde dorado = tuyo &nbsp; 🔴 borde rojo = territorio que puedes atacar</div>`;
}

// Al tocar un nodo del mapa, resalta y hace scroll a su ficha detallada en la lista de abajo.
function focusTerritory(id) {
  const el = document.getElementById('terr-' + id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 900);
}

render();
</script>
</body>
</html>
